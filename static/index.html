<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>곽봇 - 서울과기대 챗봇</title>
<link rel="icon" type="image/png" href="/static/img/favicon.png">
<style>
  :root {
    --bg: #eef3fa; --bg2: #e3ecf8; --panel: #ffffff; --text: #1b2230; --muted: #6b7687;
    --accent: #1f6feb; --accent-soft: #e4edfd; --red: #e8505b;
    --border: #dfe6f0; --user: #1f6feb; --bot: #ffffff; --pin: #e8505b;
    --shadow: 0 2px 10px rgba(31, 60, 110, .07);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11151d; --bg2: #0c1016; --panel: #181d27; --text: #e6e9f0; --muted: #96a0b2;
      --accent: #5aa9ff; --accent-soft: #1d2a40; --red: #ff7b84;
      --border: #272e3b; --user: #2f6fd0; --bot: #1f2632; --pin: #ff7b84;
      --shadow: 0 2px 12px rgba(0, 0, 0, .35); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%); background-attachment: fixed;
    color: var(--text); height: 100dvh; display: flex; flex-direction: column; }

  /* ── 헤더 ── */
  header { padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 11px; flex-wrap: wrap; box-shadow: var(--shadow); z-index: 5; }
  header .face { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft);
    display: grid; place-items: center; flex: none; overflow: hidden; }
  header .face img { width: 36px; height: 36px; object-fit: contain; object-position: top; margin-top: 3px; }
  header .who h1 { font-size: 18px; margin: 0; letter-spacing: -.3px; }
  header .who p { margin: 1px 0 0; font-size: 12px; color: var(--muted); }
  header .links { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  header .links a, header .links button { font-size: 13px; color: var(--accent); text-decoration: none;
    background: var(--accent-soft); border: none; padding: 6px 11px; border-radius: 999px;
    cursor: pointer; font-family: inherit; white-space: nowrap; transition: filter .15s; }
  header .links a:hover, header .links button:hover { filter: brightness(.95); }

  /* ── 대화 ── */
  #chat { flex: 1; overflow-y: auto; padding: 22px 18px 8px; display: flex; flex-direction: column;
    gap: 14px; max-width: 840px; width: 100%; margin: 0 auto; }
  .row { display: flex; gap: 9px; align-items: flex-end; max-width: 86%; }
  .row.me { align-self: flex-end; flex-direction: row-reverse; }
  .row .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft);
    flex: none; overflow: hidden; display: grid; place-items: center; }
  .row .avatar img { width: 31px; height: 31px; object-fit: contain; object-position: top; margin-top: 3px; }
  .msg { padding: 11px 15px; border-radius: 18px; line-height: 1.6; word-break: break-word; font-size: 15px; }
  .user { background: var(--user); color: #fff; border-bottom-right-radius: 5px; white-space: pre-wrap; }
  .bot { background: var(--bot); border: 1px solid var(--border); border-bottom-left-radius: 5px;
    box-shadow: var(--shadow); }
  .reportBtn { background: none; border: none; color: var(--muted); font-size: 11.5px; font-family: inherit;
    cursor: pointer; padding: 4px 2px 0; opacity: .75; }
  .reportBtn:hover { color: var(--accent); opacity: 1; text-decoration: underline; }
  #reportDlg .body { padding: 14px 16px 16px; max-height: none; }
  #reportDlg p.lead { margin: 0 0 10px; font-size: 13px; color: var(--muted); line-height: 1.5; }
  #reportDlg .kinds { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  #reportDlg .kinds button { font-size: 12.5px; font-family: inherit; border: 1px solid var(--border);
    background: var(--bg); color: var(--muted); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  #reportDlg .kinds button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent);
    border-color: transparent; font-weight: 600; }
  #reportDlg textarea { width: 100%; min-height: 110px; padding: 11px 13px; border: 1px solid var(--border);
    border-radius: 12px; background: var(--bg); color: var(--text); font: 14px inherit; resize: vertical; }
  #reportDlg textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  #reportDlg .send { margin-top: 10px; width: 100%; background: var(--accent); color: #fff; border: none;
    border-radius: 12px; padding: 11px; font-size: 14px; font-family: inherit; cursor: pointer; }
  #reportDlg .send:disabled { opacity: .5; }
  #reportDlg .note { margin: 9px 0 0; font-size: 11.5px; color: var(--muted); line-height: 1.5; }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 50;
    background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 9px 18px;
    font-size: 13.5px; box-shadow: var(--shadow); }
  .error { align-self: center; color: var(--red); font-size: 13px; background: var(--panel);
    border: 1px solid var(--border); padding: 8px 14px; border-radius: 999px; }

  /* ── 환영 카드 ── */
  .welcome { text-align: center; padding: 10px 0 4px; }
  .welcome img { width: 128px; height: 128px; object-fit: contain; animation: float 3.6s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  .welcome h2 { margin: 6px 0 4px; font-size: 19px; letter-spacing: -.3px; }
  .welcome p { margin: 0; color: var(--muted); font-size: 14px; }
  #quickbar { max-width: 840px; width: 100%; margin: 0 auto; padding: 4px 18px 0; }
  /* 한 줄 가로 스크롤은 마우스로 쓸기 어려워서, 줄바꿈으로 전부 보이게 한다 */
  #quickbar .chips { flex-wrap: wrap; justify-content: center; margin: 0; padding: 4px 0 0; gap: 6px; }
  #quickbar .chips button { padding: 7px 12px; font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .chips button { background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 999px; padding: 9px 14px; font-size: 13.5px; cursor: pointer; font-family: inherit;
    box-shadow: var(--shadow); transition: transform .12s, border-color .12s; }
  .chips button:hover { transform: translateY(-2px); border-color: var(--accent); }
  .chips button b { color: var(--accent); font-weight: 600; margin-right: 5px; }

  /* ── 입력 ── */
  form { display: flex; gap: 8px; padding: 10px 18px 16px; max-width: 840px; width: 100%; margin: 0 auto; }
  input { flex: 1; padding: 13px 18px; border: 1px solid var(--border); border-radius: 999px;
    background: var(--panel); color: var(--text); font-size: 15px; box-shadow: var(--shadow); }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  form button { width: 48px; height: 48px; flex: none; border: none; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 18px; cursor: pointer; box-shadow: var(--shadow); }
  form button:disabled { opacity: .45; cursor: default; }
  .foot { text-align: center; font-size: 11.5px; color: var(--muted); padding: 0 18px 12px; }

  /* ── 입력 중 표시 ── */
  .dots { display: flex; gap: 4px; padding: 4px 2px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; }
  .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

  /* ── 마크다운 ── */
  .bot p { margin: 0 0 8px; } .bot p:last-child { margin-bottom: 0; }
  .bot ul, .bot ol { margin: 4px 0 8px; padding-left: 20px; }
  .bot li { margin: 3px 0; }
  .bot a { color: var(--accent); word-break: break-all; }
  .bot h1, .bot h2, .bot h3 { font-size: 15px; margin: 10px 0 4px; }
  .bot code { background: var(--accent-soft); padding: 1px 5px; border-radius: 5px; font-size: 13px; }
  .bot table { border-collapse: collapse; font-size: 13.5px; margin: 6px 0; display: block; overflow-x: auto; }
  .bot th, .bot td { border: 1px solid var(--border); padding: 5px 9px; text-align: left; }
  .bot th { background: var(--accent-soft); }

  /* ── 캠퍼스 지도 ── */
  .mapbox { margin-top: 10px; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: var(--panel); }
  .mapbox .frame { position: relative; line-height: 0; cursor: zoom-in; }
  .mapbox img { width: 100%; height: auto; display: block; }
  .mapbox .cap { font-size: 12px; color: var(--muted); padding: 7px 11px; line-height: 1.4;
    display: flex; justify-content: space-between; gap: 8px; }
  .mapbox .cap a { color: var(--accent); white-space: nowrap; }
  .pin { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 4px; pointer-events: none; }
  .pin b { width: 22px; height: 22px; border-radius: 50%; background: var(--pin); color: #fff; font-size: 11px;
    display: flex; align-items: center; justify-content: center; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .pin em { font-style: normal; font-size: 11px; font-weight: 700; color: #fff; background: var(--pin);
    padding: 2px 6px; border-radius: 10px; white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .pin.ping b { animation: ping 1.6s ease-out 3; }
  @keyframes ping { 0%, 100% { box-shadow: 0 1px 4px rgba(0,0,0,.4); } 50% { box-shadow: 0 0 0 8px rgba(232,80,91,.35); } }

  dialog { border: none; border-radius: 16px; padding: 0; background: var(--panel); color: var(--text);
    width: min(96vw, 940px); max-height: 94vh; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog .head { display: flex; align-items: center; gap: 10px; padding: 11px 15px; border-bottom: 1px solid var(--border); }
  dialog .head strong { font-size: 15px; }
  dialog .head .close { margin-left: auto; background: none; border: none; color: var(--muted);
    font-size: 20px; padding: 0 6px; cursor: pointer; }
  dialog .body { overflow: hidden; max-height: 80vh; }
  dialog .frame { position: relative; line-height: 0; width: 100%; }
  dialog .frame img { width: 100%; height: auto; display: block; }

  /* 확대·이동 (휠/핀치 줌, 드래그) */
  .zoomwrap { position: relative; overflow: hidden; touch-action: none; cursor: grab; background: var(--bg);
    height: min(72vh, 640px); user-select: none; -webkit-user-select: none; }
  .zoomwrap img { -webkit-user-drag: none; user-drag: none; pointer-events: none; }
  .zoomwrap.grabbing { cursor: grabbing; }
  .zoomwrap > .pz { transform-origin: 0 0; will-change: transform; }
  .zoomwrap > .pz img { width: 100%; height: auto; display: block; }
  .zoomctl { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 6px; z-index: 3; }
  .zoomctl button { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 16px; line-height: 1; cursor: pointer;
    box-shadow: var(--shadow); display: grid; place-items: center; padding: 0; }
  .zoomctl button:hover { border-color: var(--accent); color: var(--accent); }
  .binfo { position: absolute; left: 12px; top: 12px; z-index: 4; width: min(300px, calc(100% - 24px));
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow);
    padding: 12px 14px; max-height: calc(100% - 24px); overflow-y: auto; }
  .binfo h4 { margin: 0 0 2px; font-size: 15px; }
  .binfo .num { font-size: 11.5px; color: #fff; background: var(--pin); border-radius: 999px; padding: 1px 8px; margin-right: 6px; }
  .binfo .orgs { font-size: 12.5px; color: var(--accent); margin: 6px 0 0; line-height: 1.5; }
  .binfo .note { font-size: 12.5px; color: var(--red); margin: 7px 0 0; line-height: 1.5; }
  .binfo ul { list-style: none; margin: 8px 0 0; padding: 0; }
  .binfo li { font-size: 12.5px; color: var(--muted); padding: 3px 0; border-top: 1px solid var(--border); }
  .binfo .close2 { position: absolute; right: 8px; top: 8px; background: none; border: none; color: var(--muted);
    font-size: 15px; cursor: pointer; padding: 2px 5px; }
  .binfo .more2 { font-size: 11.5px; color: var(--muted); margin-top: 7px; }
  .binfo .moreBtn { margin-top: 10px; width: 100%; background: var(--accent-soft); color: var(--accent);
    border: none; border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-family: inherit; cursor: pointer; }
  .binfo .moreBtn:hover { filter: brightness(.96); }
  .zoomhint { position: absolute; left: 12px; bottom: 14px; z-index: 3; font-size: 11.5px; color: var(--muted);
    background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; opacity: .92; }

  /* ── 홈 대시보드 ── */
  [hidden] { display: none !important; }   /* #chat 의 display:flex 가 hidden 을 이기지 못하도록 */
  .tabs { display: flex; gap: 4px; background: var(--accent-soft); padding: 3px; border-radius: 999px; }
  .tabs button { background: none; border: none; color: var(--muted); font-size: 13px; font-family: inherit;
    padding: 6px 14px; border-radius: 999px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--panel); color: var(--accent); font-weight: 700; box-shadow: var(--shadow); }

  #home { flex: 1; overflow-y: auto; padding: 20px 18px 8px; max-width: 980px; width: 100%; margin: 0 auto; }
  /* 학교 로고 — 공식 파일을 변형 없이 그대로 쓴다 (밝은 배경: 컬러 / 어두운 배경: 백색) */
  .brand { text-align: center; padding: 10px 0 22px; }
  .brand .logo { width: min(320px, 76%); height: auto; display: block; margin: 0 auto; }
  .brand .dark-only { display: none; }
  @media (prefers-color-scheme: dark) {
    .brand .light-only { display: none; }
    .brand .dark-only { display: block; }
  }
  .brand p { margin: 12px 0 0; color: var(--muted); font-size: 14px; }

  /* 아이콘 타일 — 누르면 해당 정보가 뜬다 */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; }
  .tile { background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
    box-shadow: var(--shadow); padding: 20px 12px 16px; cursor: pointer; font-family: inherit;
    color: var(--text); display: flex; flex-direction: column; align-items: center; gap: 3px;
    transition: transform .14s, border-color .14s, box-shadow .14s; }
  .tile:hover { transform: translateY(-3px); border-color: var(--accent); }
  .tile:active { transform: translateY(0); }
  .tile .ico { font-size: 40px; line-height: 1.1; }
  .tile img { width: 52px; height: 52px; object-fit: contain; object-position: top; }
  .tile b { font-size: 15px; letter-spacing: -.2px; margin-top: 5px; }
  .tile .sub { font-size: 11.5px; color: var(--muted); }
  .botrow { grid-template-columns: 1fr; margin-top: 13px; }
  .tile.bot { background: linear-gradient(100deg, var(--accent-soft), var(--panel));
    flex-direction: row; justify-content: center; gap: 12px; padding: 14px 12px; }
  .tile.bot img { width: 44px; height: 44px; }
  .tile.bot b { color: var(--accent); font-size: 18px; letter-spacing: .5px; margin: 0; }
  .tile.bot .sub { font-size: 12.5px; }

  /* ── 학생회관 식당: 메뉴 목록과 별점 ── */
  .halltabs { display: flex; gap: 6px; padding: 2px 16px 10px; flex-wrap: wrap; }
  .halltabs button { font-size: 12.5px; font-family: inherit; border: 1px solid var(--border);
    background: var(--bg); color: var(--muted); border-radius: 999px; padding: 6px 13px; cursor: pointer; }
  .halltabs button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent);
    border-color: transparent; font-weight: 700; }
  .brandname { font-size: 12px; color: var(--muted); font-weight: 700; padding: 12px 16px 5px; }
  .mlist { list-style: none; margin: 0; padding: 0 16px; }
  .mlist li { border-top: 1px solid var(--border); }
  .mlist li:first-child { border-top: none; }
  .mrow { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 2px;
    background: none; border: none; color: var(--text); font-family: inherit; cursor: pointer; text-align: left; }
  .mrow:hover .mname { color: var(--accent); }
  .mrow .mname { font-size: 14px; flex: 1; line-height: 1.4; }
  .mrow .mprice { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .mrow .mscore { font-size: 12px; color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 3px; }
  .mrow .mscore b { color: #f5a623; font-weight: 700; }
  .mrow .mine { color: var(--accent); font-weight: 700; }
  .mrow .rank { font-size: 12px; color: var(--muted); font-weight: 700; min-width: 20px;
    text-align: center; flex: none; }
  .mrow .rank.top { color: #f5a623; font-size: 14px; }
  .mrow .mname { display: flex; flex-direction: column; gap: 2px; }
  .mrow .msub { font-size: 11.5px; color: var(--muted); }

  /* 별 표시: 회색 별 위에 금색 별을 너비로 잘라 얹어 0.5점을 정확히 그린다 */
  .stars { position: relative; display: inline-block; line-height: 1; white-space: nowrap;
    font-size: 15px; letter-spacing: 1px; }
  .stars .base { color: var(--border); }
  .stars .fill { position: absolute; left: 0; top: 0; overflow: hidden; color: #f5a623; }
  .stars.big { font-size: 34px; letter-spacing: 4px; }

  /* 별점 고르기: 별 위에 반 칸짜리 버튼 10개를 겹쳐 둔다 */
  .starpick { position: relative; display: inline-block; }
  .starpick .hit { position: absolute; top: 0; height: 100%; width: 10%; padding: 0;
    background: none; border: none; cursor: pointer; }
  .starpick .hit:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .rv { padding: 0 16px 4px; }
  .rv .back { background: none; border: none; color: var(--accent); font-family: inherit;
    font-size: 13px; cursor: pointer; padding: 2px 0 10px; }
  .rv h4 { margin: 0 0 2px; font-size: 16px; }
  .rv .sub2 { margin: 0 0 14px; font-size: 12.5px; color: var(--muted); }
  .rv .pickbox { text-align: center; background: var(--bg); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px 12px 14px; }
  .rv .picked { margin-top: 8px; font-size: 13px; color: var(--muted); min-height: 18px; }
  .rv .picked b { color: #f5a623; font-size: 15px; }
  .rv form { display: flex; gap: 7px; margin-top: 12px; }
  .rv input { flex: 1; min-width: 0; padding: 10px 13px; border: 1px solid var(--border);
    border-radius: 11px; font: 14px inherit; background: var(--panel); color: var(--text); }
  .rv button.send { background: var(--accent); color: #fff; border: none; border-radius: 11px;
    padding: 0 16px; font: 600 14px inherit; cursor: pointer; white-space: nowrap; }
  .rv button.send:disabled { opacity: .45; cursor: default; }
  .rv .note { margin: 9px 0 0; font-size: 11.5px; color: var(--muted); line-height: 1.5; }
  .rv .rlist { list-style: none; margin: 16px 0 0; padding: 0; }
  .rv .rlist li { border-top: 1px solid var(--border); padding: 10px 0; font-size: 13.5px; line-height: 1.5; }
  .rv .rlist .when { font-size: 11.5px; color: var(--muted); margin-left: 6px; }

  /* 타일을 눌렀을 때 뜨는 정보창 */
  #panelDlg { width: min(94vw, 560px); }
  #panelDlg .body { padding: 4px 0 10px; overflow-y: auto; max-height: 76vh; }
  #panelDlg .card { border: none; box-shadow: none; background: none; }
  #panelDlg .card > h3 { display: none; }   /* 제목은 창 머리에 이미 있다 */
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: var(--shadow); overflow: hidden; }
  .card > h3 { margin: 0; padding: 13px 16px 10px; font-size: 14.5px; display: flex; align-items: center; gap: 7px; }
  .card > h3 span.more { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--muted); }
  .card ul { list-style: none; margin: 0; padding: 0 16px 14px; }
  .card li { padding: 8px 0; border-top: 1px solid var(--border); font-size: 13.5px; line-height: 1.5; }
  .card li:first-child { border-top: none; }
  .card a { color: inherit; text-decoration: none; display: block; }
  .card a:hover { color: var(--accent); }
  .meal { display: flex; gap: 9px; }
  .meal b { flex: none; width: 32px; color: var(--accent); font-size: 12.5px; padding-top: 1px; }
  .dorm-tabs { display: flex; gap: 6px; padding: 0 16px 10px; flex-wrap: wrap; }
  .dorm-tabs button { font-size: 12px; font-family: inherit; border: 1px solid var(--border); background: var(--bg);
    color: var(--muted); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
  .dorm-tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
  .dday { display: inline-block; min-width: 46px; font-size: 11.5px; font-weight: 700; color: #fff;

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
let welcome = document.getElementById("welcome");
const history = [];

// ---- 캠퍼스 지도 데이터 (app/campus_map.py 가 생성) ----
let MAP = null;
// 수집기가 주기적으로 갱신하므로 캐시를 쓰지 않고 매번 서버에 확인한다
fetch('/static/campus_buildings.json', { cache: 'no-cache' })
  .then(r => r.ok ? r.json() : null).then(d => { MAP = d; }).catch(() => {});

const LOCATION_Q = /어디\s*(있|야|에|냐|쯤|인가)|어딨|위치|찾아가|가는\s*법|건물|호실|몇\s*층|지도|캠퍼스/;

function findBuildings(text, question) {
  if (!MAP) return [];
  const hasBuildingNo = /\d{1,2}\s*번/.test(text);
  if (!hasBuildingNo && !(question && LOCATION_Q.test(question))) return [];
  const byNum = new Map(MAP.buildings.map(b => [b.num, b]));
  const found = new Map();
  const names = MAP.buildings.map(b => [b.name, b.num])
    .concat(Object.entries(MAP.aliases))
    .sort((a, b) => b[0].length - a[0].length);
  let rest = text;
  for (const [name, num] of names) {
    if (name.length >= 2 && rest.includes(name) && byNum.has(num)) {
      found.set(num, byNum.get(num));
      rest = rest.split(name).join(' ');
    }
  }
  for (const m of text.matchAll(/(\d{1,2})\s*번/g)) {
    if (byNum.has(m[1])) found.set(m[1], byNum.get(m[1]));
  }
  return [...found.values()].slice(0, 5);
}

function renderPins(frame, pins, opts) {
  opts = opts || {};
  for (const b of pins) {
    const el = document.createElement('div');
    el.className = 'pin' + (opts.ping ? ' ping' : '');
    el.style.left = (b.x / MAP.width * 100) + '%';
    el.style.top = (b.y / MAP.height * 100) + '%';
    const num = document.createElement('b');
    num.textContent = b.num;
    el.appendChild(num);
    if (opts.label) {
      const name = document.createElement('em');
      name.textContent = b.name;
      el.appendChild(name);
    }
    frame.appendChild(el);
  }
}

function mapImage() {
  const img = document.createElement('img');
  img.src = MAP.image;
  img.alt = '서울과학기술대학교 캠퍼스 지도';
  return img;
}

function buildMapBox(pins) {
  const box = document.createElement('div');
  box.className = 'mapbox';
  const frame = document.createElement('div');
  frame.className = 'frame';
  frame.appendChild(mapImage());
  renderPins(frame, pins, { label: true, ping: true });
  frame.addEventListener('click', () => openMapDialog(pins));

  const cap = document.createElement('div');
  cap.className = 'cap';
  const who = document.createElement('span');
  who.textContent = pins.map(b => b.num + '번 ' + b.name).join(' · ') + ' (클릭하면 크게)';
  const link = document.createElement('a');
  link.href = MAP.page; link.target = '_blank'; link.rel = 'noopener';
  link.textContent = '층별 안내 보기';
  cap.append(who, link);

  box.append(frame, cap);
  return box;
}

// ---- 확대·이동 (휠/핀치 줌, 드래그) ----
const UI_IN_WRAP = '[data-zoom], .binfo';   // 지도 위에 떠 있는 조작 요소들

function makePanZoom(wrap, { min = 1, max = 8, onTap = null } = {}) {
  // min 은 reset() 에서 화면에 맞춰 다시 계산된다
  const content = wrap.querySelector('.pz');
  let scale = 1, tx = 0, ty = 0;

  const apply = () => {
    const w = wrap.clientWidth, h = wrap.clientHeight;
    const cw = content.offsetWidth * scale, ch = content.offsetHeight * scale;
    // 화면보다 작으면 가운데로, 크면 빈 공간이 생기지 않게 가둔다
    tx = cw <= w ? (w - cw) / 2 : Math.min(0, Math.max(w - cw, tx));
    ty = ch <= h ? (h - ch) / 2 : Math.min(0, Math.max(h - ch, ty));
    content.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  };

  // (cx, cy) 지점을 고정한 채 확대·축소
  const zoomAt = (factor, cx, cy) => {
    const next = Math.min(max, Math.max(min, scale * factor));
    const ratio = next / scale;
    tx = cx - (cx - tx) * ratio;
    ty = cy - (cy - ty) * ratio;
    scale = next;
    apply();
  };

  // 세로가 넘칠 때는 전체가 보이도록 줄여서 시작하고, 그 배율을 최소 배율로 삼는다
  const fitScale = () => {
    const h = wrap.clientHeight, ch = content.offsetHeight;
    return ch && ch > h ? Math.max(0.2, h / ch) : 1;
  };
  const reset = () => { min = fitScale(); scale = min; tx = ty = 0; apply(); };

  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    const r = wrap.getBoundingClientRect();
    zoomAt(e.deltaY < 0 ? 1.18 : 1 / 1.18, e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });

  wrap.addEventListener('dblclick', e => {
    const r = wrap.getBoundingClientRect();
    zoomAt(scale >= max - 0.01 ? min / scale : 1.8, e.clientX - r.left, e.clientY - r.top);
  });

  // 드래그(한 손가락) + 핀치(두 손가락)
  const pointers = new Map();
  let last = null, pinch = 0, moved = 0, downAt = null;

  wrap.addEventListener('dragstart', e => e.preventDefault());
  wrap.addEventListener('pointerdown', e => {
    if (e.target.closest(UI_IN_WRAP)) return;   // 버튼·정보 카드 클릭은 드래그로 보지 않는다
    e.preventDefault();
    wrap.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    last = { x: e.clientX, y: e.clientY };
    moved = 0;
    downAt = { x: e.clientX, y: e.clientY };
    wrap.classList.add('grabbing');
  });

  wrap.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pointers.size >= 2) {
      const [a, b] = [...pointers.values()];
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinch) {
        const r = wrap.getBoundingClientRect();
        zoomAt(dist / pinch, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
      }
      pinch = dist;
      return;
    }
    if (last) {
      moved += Math.abs(e.clientX - last.x) + Math.abs(e.clientY - last.y);
      tx += e.clientX - last.x;
      ty += e.clientY - last.y;
      last = { x: e.clientX, y: e.clientY };
      apply();
    }
  });

  const release = e => {
    // 거의 움직이지 않았다면 클릭으로 보고, 콘텐츠 기준 좌표를 넘긴다
    if (onTap && downAt && moved < 6 && pointers.size === 1 && !e.target.closest(UI_IN_WRAP)) {
      const r = wrap.getBoundingClientRect();
      onTap((e.clientX - r.left - tx) / scale, (e.clientY - r.top - ty) / scale, content);
    }
    downAt = null;
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = 0;
    if (!pointers.size) { last = null; wrap.classList.remove('grabbing'); }
  };
  wrap.addEventListener('pointerup', release);
  wrap.addEventListener('pointercancel', release);

  wrap.querySelectorAll('[data-zoom]').forEach(btn => {
    btn.addEventListener('click', () => {
      const kind = btn.dataset.zoom;
      if (kind === 'reset') return reset();
      zoomAt(kind === 'in' ? 1.5 : 1 / 1.5, wrap.clientWidth / 2, wrap.clientHeight / 2);
    });
  });

  return { reset, apply };
}

const dlg = document.getElementById('mapDlg');
const dlgFrame = document.getElementById('mapDlgFrame');
const mapZoomEl = document.getElementById('mapZoom');

// 지도에서 누른 지점과 가장 가까운 건물 핀을 찾아 정보 카드를 띄운다
function showBuildingInfo(b) {
  mapZoomEl.querySelector('.binfo')?.remove();
  const box = el('div', 'binfo');
  const close = el('button', 'close2', '✕');
  close.type = 'button';
  close.addEventListener('click', () => box.remove());

  const title = el('h4');
  title.append(el('span', 'num', b.num + '번'), document.createTextNode(b.name));
  box.append(close, title);

  if (b.note) box.append(el('p', 'note', '※ ' + b.note));

  // 호실을 바로 쏟지 않고, 어떤 학과·기관이 있는지만 먼저 보여준다
  const summary = [...(b.depts || []), ...(b.orgs || []).filter(o => !(b.depts || []).includes(o))];
  if (summary.length) box.append(el('p', 'orgs', summary.join(' · ')));
  else if (!b.note) box.append(el('p', 'more2', '이 건물의 입주 정보는 자료에 없어요.'));

  if (b.rooms?.length) {
    const toggle = el('button', 'moreBtn', `정보 더보기 (호실 ${b.roomCount}개) ▾`);
    toggle.type = 'button';
    const list = el('ul');
    list.hidden = true;
    b.rooms.forEach(r => list.append(el('li', null, r)));
    if (b.roomCount > b.rooms.length) {
      list.append(el('li', 'more2', `그 외 ${b.roomCount - b.rooms.length}개 호실은 학교 캠퍼스지도에서 확인하세요.`));
    }
    toggle.addEventListener('click', () => {
      list.hidden = !list.hidden;
      toggle.textContent = (list.hidden ? '정보 더보기' : '접기') + ` (호실 ${b.roomCount}개) ` + (list.hidden ? '▾' : '▴');
    });
    box.append(toggle, list);
  }
  mapZoomEl.append(box);
}

function pickBuilding(cx, cy, content) {
  if (!MAP) return;
  // 콘텐츠 좌표(px) → 지도 원본 좌표(900x582) 로 환산
  const sx = MAP.width / content.offsetWidth, sy = MAP.height / content.offsetHeight;
  const mx = cx * sx, my = cy * sy;
  let best = null, bestDist = Infinity;
  for (const b of MAP.buildings) {
    const d = Math.hypot(b.x - mx, b.y - my);
    if (d < bestDist) { best = b; bestDist = d; }
  }
  if (best && bestDist < 26) showBuildingInfo(best);
  else mapZoomEl.querySelector('.binfo')?.remove();
}

const mapPanZoom = makePanZoom(mapZoomEl, { onTap: pickBuilding });

function openMapDialog(pins) {
  if (!MAP) return;
  const marked = pins && pins.length;
  dlgFrame.replaceChildren(mapImage());
  renderPins(dlgFrame, marked ? pins : MAP.buildings, { label: !!marked, ping: !!marked });
  mapZoomEl.querySelector('.binfo')?.remove();
  dlg.showModal();
  mapPanZoom.reset();
  // 지도 이미지가 아직 로드되지 않았으면 높이를 알 수 없으므로 로드 후 한 번 더 맞춘다
  const mapImg = dlgFrame.querySelector('img');
  if (mapImg && !mapImg.complete) mapImg.addEventListener('load', mapPanZoom.reset, { once: true });
}

// 자동 링크가 뒤따르는 한글 조사나 닫는 괄호까지 삼키는 문제를 바로잡는다.
// 예: "(https://www.seoultech.ac.kr)에서" → 링크에 ")에서" 가 포함돼 주소가 깨짐
const LINK_TAIL = /[가-힣ㄱ-ㅎㅏ-ㅣ)\]}>,.;:!?'"」』]+$/;

function trimAutoLinks(root) {
  for (const a of root.querySelectorAll('a[href]')) {
    let href = a.getAttribute('href');
    let decoded;
    try { decoded = decodeURI(href); } catch { continue; }
    // [텍스트](주소) 형태는 손대지 않는다 — 글자가 그대로 드러난 자동 링크만 다듬는다
    if (a.textContent !== decoded && a.textContent !== href) continue;
    const tail = (decoded.match(LINK_TAIL) || [''])[0];
    if (!tail) continue;
    const clean = decoded.slice(0, decoded.length - tail.length);
    if (!/^https?:\/\/[^/]+/.test(clean)) continue;
    a.setAttribute('href', clean);
    a.textContent = clean;
    a.after(document.createTextNode(tail));
  }
}

function renderMd(text) {
  const holder = document.createElement('div');
  holder.innerHTML = DOMPurify.sanitize(window.marked.parse(text, { breaks: true }));
  trimAutoLinks(holder);
  for (const a of holder.querySelectorAll('a')) {
    a.target = '_blank';
    a.rel = 'noopener';
  }
  return holder.innerHTML;
}

// ---- 전송 ----
async function send(text) {
  text = text.trim();
  if (!text || sendBtn.disabled) return;
  showView('chat');
  welcome?.remove();
  input.value = '';
  sendBtn.disabled = true;

  addRow('user').msg.textContent = text;
  history.push({ role: 'user', content: text });

  const { row, msg } = addRow('bot');
  msg.appendChild(typingDots());
  let reply = '';

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history }),
    });
    if (!res.ok) {
      // 사용량 제한(429)은 서버가 보낸 안내 문구를 그대로 보여준다
      let note = '서버 오류 ' + res.status;
      try { note = (await res.json()).detail || note; } catch (e) {}
      throw new Error(note);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6);
        if (payload === '[DONE]') continue;
        const data = JSON.parse(payload);
        if (data.error) throw new Error(data.error);
        reply += data.text;
        msg.innerHTML = renderMd(reply);
        chat.scrollTop = chat.scrollHeight;
      }
    }
    if (reply) {
      history.push({ role: 'assistant', content: reply });
      const flag = el('button', 'reportBtn', '🚩 이 답변이 틀렸나요?');
      flag.type = 'button';
      flag.addEventListener('click', () => openReport('correction', { question: text, answer: reply }));
      msg.append(flag);
      const pins = findBuildings(reply, text);
      if (pins.length) {
        msg.appendChild(buildMapBox(pins));
        chat.scrollTop = chat.scrollHeight;
      }
    } else {
      row.remove();
    }
  } catch (err) {
    row.remove();
    history.pop();
    addError(err.message);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

}

function clientId() {
  try {
    let v = localStorage.getItem('kwakbot-client');
    if (!v) {
      v = 'c' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('kwakbot-client', v);
    }
    return v;
  } catch (e) {
    return 'c-temp-' + Date.now().toString(36);   // 저장을 막아둔 브라우저
  }
}

let HALLS = null, STATS = {}, MINE = {}, hallIdx = 0;
let sortMode = 'rating';   // rating(별점순) | count(리뷰많은순) | menu(메뉴판순)

const wonText = price => Number(String(price).replace(/,/g, '')).toLocaleString() + '원';

// 회색 별 위에 금색 별을 너비로 잘라 얹는다 — 0.5점이 정확히 반 칸으로 보인다

// 지금 보고 있는 식당의 메뉴 (마지막 칸은 '전체' = 두 식당 합쳐 보기)
function currentItems() {
  if (hallIdx >= HALLS.length) {
    return HALLS.flatMap(h => h.items.map(it => ({ ...it, hall: h.name })));
  }
  return HALLS[hallIdx].items.map(it => ({ ...it, hall: HALLS[hallIdx].name }));

function hallView() {
  const box = el('div');

  const halls = HALLS.map((h, i) => [i, h.name]);
  halls.push([HALLS.length, '전체']);
  box.append(chipRow(halls, hallIdx, v => { hallIdx = v; showHall(); }));
  box.append(chipRow([['rating', '⭐ 별점순'], ['count', '🔥 리뷰 많은 순'], ['menu', '메뉴판 순']],
                     sortMode, v => { sortMode = v; showHall(); }));

  const items = currentItems();
  const rated = items.filter(it => STATS[it.id]).length;

  if (sortMode === 'menu') {
    let brand = null, list = null;
    for (const it of items) {
      const head = (hallIdx >= HALLS.length ? it.hall + ' · ' : '') + it.brand;
      if (head !== brand) {
        brand = head;
        box.append(el('div', 'brandname', head));
        list = el('ul', 'mlist');
        box.append(list);
      }
      list.append(menuRow(it, 0));
    }
    return box;
  }

  // 별점순 / 리뷰 많은 순 — 아직 아무도 안 매긴 메뉴는 뒤로 보낸다
  const key = sortMode === 'rating'
    ? it => [STATS[it.id] ? STATS[it.id].avg : -1, STATS[it.id] ? STATS[it.id].count : 0]
    : it => [STATS[it.id] ? STATS[it.id].count : -1, STATS[it.id] ? STATS[it.id].avg : 0];
  const sorted = [...items].sort((a, b) => {
    const ka = key(a), kb = key(b);
    return kb[0] - ka[0] || kb[1] - ka[1];
  });

  box.append(el('div', 'brandname',
    rated ? (sortMode === 'rating' ? '별점이 높은 메뉴부터' : '리뷰가 많은 메뉴부터')
          : '아직 별점이 없어요 — 먹어봤다면 첫 별점을 남겨주세요'));
  const list = el('ul', 'mlist');
  sorted.forEach((it, i) => list.append(menuRow(it, i + 1)));
  box.append(list);
  return box;

function showReview(item) {

  // 별점 고르기 — 별 위에 반 칸짜리 투명 버튼 10개를 겹쳐 둔다
  let picked = MINE[item.id] || 0;
  const pickbox = el('div', 'pickbox');
  const pick = el('span', 'starpick');
  const shown = starsEl(picked, true);
  pick.append(shown);
  const label = el('div', 'picked');

  const paint = v => {
    shown.querySelector('.fill').style.width = (v / 5 * 100) + '%';
    label.replaceChildren(v ? el('b', null, v.toFixed(1) + '점')
                            : el('span', null, '별을 눌러 점수를 주세요'));
  };

  const form = el('form');
  const input = el('input');
  input.type = 'text';
  input.maxLength = 80;
  input.placeholder = '한줄평 (선택) 예: 양 많고 가성비 좋아요';
  const send = el('button', 'send', '남기기');
  send.type = 'submit';
  send.disabled = !picked;

  for (let i = 1; i <= 10; i++) {
    const v = i / 2;
    const hit = el('button', 'hit');
    hit.type = 'button';
    hit.style.left = ((i - 1) * 10) + '%';
    hit.setAttribute('aria-label', v + '점');
    hit.addEventListener('mouseenter', () => paint(v));
    hit.addEventListener('focus', () => paint(v));
    hit.addEventListener('click', () => { picked = v; paint(v); send.disabled = false; });
    pick.append(hit);
  }
  pick.addEventListener('mouseleave', () => paint(picked));
  pickbox.append(pick, label);
  box.append(pickbox);

  form.append(input, send);
  box.append(form);
  box.append(el('p', 'note', '누구나 볼 수 있어요. 이름·학번은 저장하지 않습니다. '
                           + '같은 메뉴에 다시 남기면 이전 것을 대신합니다.'));

  const rlist = el('ul', 'rlist');
  box.append(rlist);
  loadReviews(item.id, rlist);

  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!picked) return;
    send.disabled = true;
    try {
      const res = await fetch('/api/menu/review', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item: item.id, rating: picked,
                               comment: input.value.trim(), client: CLIENT }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || '저장하지 못했어요.');
      STATS[item.id] = data.stats;
      MINE[item.id] = picked;
      paint(picked);
      label.append(el('span', null, ' · 고마워요! 😊'));
      input.value = '';
      loadReviews(item.id, rlist);
    } catch (err) {
      label.replaceChildren(el('span', null, err.message));
    }
    send.disabled = false;
  });

  panelBody.replaceChildren(box);
  panelBody.scrollTop = 0;
  paint(picked);
}

function openHallPanel() {
  const start = () => { showHall(); panelDlg.showModal(); };
  if (HALLS) return start();
  fetch('/api/menu?client=' + encodeURIComponent(CLIENT))
    .then(r => r.json())
    .then(d => {
      HALLS = d.halls || [];
      STATS = d.stats || {};
      MINE = d.mine || {};
      if (!HALLS.length) throw new Error('메뉴 없음');
      start();
    })
    .catch(() => {
      panelTitle.textContent = '🍜 학생회관 식당';
      panelBody.replaceChildren(el('div', 'empty', '메뉴를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.'));
      panelDlg.showModal();
    });
}

// ---- 타일을 누르면 해당 정보를 창으로 보여준다 ----
let HOME = null;
const panelDlg = document.getElementById('panelDlg');
const panelBody = document.getElementById('panelBody');
const panelTitle = document.getElementById('panelTitle');

// 타일 → [창 제목, 내용 만드는 함수]
const PANELS = {
  menu:     () => ['🍚 오늘 식단', menuCard(HOME.menu, HOME.technopark)],
  notice:   () => ['📢 최근 공지사항', noticeCard(HOME.notices)],
  schedule: () => ['📅 다가오는 학사일정', scheduleCard(HOME.schedule)],
  link:     () => ['🔗 자주 가는 곳', linkCard(HOME.shortcuts)],
};

function openPanel(kind) {
  if (kind === 'map') return openMapDialog(null);
  if (kind === 'hall') return openHallPanel();
  if (kind === 'bot') return showView('chat');
  if (!HOME) return;
  const [title, content] = PANELS[kind]();
  panelTitle.textContent = title;
  panelBody.replaceChildren(content);
  panelDlg.showModal();
}

document.getElementById('tiles').addEventListener('click', e => {
  const tile = e.target.closest('.tile');
  if (tile) openPanel(tile.dataset.panel);
});
panelDlg.querySelector('.close').addEventListener('click', () => panelDlg.close());
panelDlg.addEventListener('click', e => { if (e.target === panelDlg) panelDlg.close(); });

fetch('/api/home').then(r => r.json()).then(d => {
  HOME = d;
  const [y, m, day] = d.today.split('-');
  document.getElementById('heroSub').textContent =
    `${Number(m)}월 ${Number(day)}일 (${d.weekday}) · 궁금한 걸 눌러보세요`;
  document.getElementById('stamp').textContent = d.collected_at ? `자료 수집: ${d.collected_at}` : '';
}).catch(() => {
  document.getElementById('heroSub').textContent =
    '소식을 불러오지 못했어요. 잠시 후 새로고침해 주세요.';
});
</script>
