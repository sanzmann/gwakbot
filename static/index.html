<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>곽봇 - 서울과기대 챗봇</title>
<link rel="icon" type="image/png" href="/static/img/favicon.png">
<style>
  :root {
    --bg: #eef3fa; --bg2: #e3ecf8; --panel: #ffffff; --text: #1b2230; --muted: #6b7687;
    --accent: #1f6feb; --accent-soft: #e4edfd; --red: #e8505b;
    --border: #dfe6f0; --user: #1f6feb; --bot: #ffffff; --pin: #e8505b;
    --shadow: 0 2px 10px rgba(31, 60, 110, .07);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11151d; --bg2: #0c1016; --panel: #181d27; --text: #e6e9f0; --muted: #96a0b2;
      --accent: #5aa9ff; --accent-soft: #1d2a40; --red: #ff7b84;
      --border: #272e3b; --user: #2f6fd0; --bot: #1f2632; --pin: #ff7b84;
      --shadow: 0 2px 12px rgba(0, 0, 0, .35); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%); background-attachment: fixed;
    color: var(--text); height: 100dvh; display: flex; flex-direction: column; }

  /* ── 헤더 ── */
  header { padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 11px; flex-wrap: wrap; box-shadow: var(--shadow); z-index: 5; }
  header .face { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft);
    display: grid; place-items: center; flex: none; overflow: hidden; }
  header .face img { width: 36px; height: 36px; object-fit: contain; object-position: top; margin-top: 3px; }
  header .who h1 { font-size: 18px; margin: 0; letter-spacing: -.3px; }
  header .who p { margin: 1px 0 0; font-size: 12px; color: var(--muted); }
  header .links { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  header .links a, header .links button { font-size: 13px; color: var(--accent); text-decoration: none;
    background: var(--accent-soft); border: none; padding: 6px 11px; border-radius: 999px;
    cursor: pointer; font-family: inherit; white-space: nowrap; transition: filter .15s; }
  header .links a:hover, header .links button:hover { filter: brightness(.95); }

  /* ── 대화 ── */
  #chat { flex: 1; overflow-y: auto; padding: 22px 18px 8px; display: flex; flex-direction: column;
    gap: 14px; max-width: 840px; width: 100%; margin: 0 auto; }
  .row { display: flex; gap: 9px; align-items: flex-end; max-width: 86%; }
  .row.me { align-self: flex-end; flex-direction: row-reverse; }
  .row .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft);
    flex: none; overflow: hidden; display: grid; place-items: center; }
  .row .avatar img { width: 31px; height: 31px; object-fit: contain; object-position: top; margin-top: 3px; }
  .msg { padding: 11px 15px; border-radius: 18px; line-height: 1.6; word-break: break-word; font-size: 15px; }
  .user { background: var(--user); color: #fff; border-bottom-right-radius: 5px; white-space: pre-wrap; }
  .bot { background: var(--bot); border: 1px solid var(--border); border-bottom-left-radius: 5px;
    box-shadow: var(--shadow); }
  .error { align-self: center; color: var(--red); font-size: 13px; background: var(--panel);
    border: 1px solid var(--border); padding: 8px 14px; border-radius: 999px; }

  /* ── 환영 카드 ── */
  .welcome { text-align: center; padding: 10px 0 4px; }
  .welcome img { width: 128px; height: 128px; object-fit: contain; animation: float 3.6s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  .welcome h2 { margin: 6px 0 4px; font-size: 19px; letter-spacing: -.3px; }
  .welcome p { margin: 0; color: var(--muted); font-size: 14px; }
  #quickbar { max-width: 840px; width: 100%; margin: 0 auto; padding: 4px 18px 0; }
  /* 한 줄 가로 스크롤은 마우스로 쓸기 어려워서, 줄바꿈으로 전부 보이게 한다 */
  #quickbar .chips { flex-wrap: wrap; justify-content: center; margin: 0; padding: 4px 0 0; gap: 6px; }
  #quickbar .chips button { padding: 7px 12px; font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .chips button { background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 999px; padding: 9px 14px; font-size: 13.5px; cursor: pointer; font-family: inherit;
    box-shadow: var(--shadow); transition: transform .12s, border-color .12s; }
  .chips button:hover { transform: translateY(-2px); border-color: var(--accent); }
  .chips button b { color: var(--accent); font-weight: 600; margin-right: 5px; }

  /* ── 입력 ── */
  form { display: flex; gap: 8px; padding: 10px 18px 16px; max-width: 840px; width: 100%; margin: 0 auto; }
  input { flex: 1; padding: 13px 18px; border: 1px solid var(--border); border-radius: 999px;
    background: var(--panel); color: var(--text); font-size: 15px; box-shadow: var(--shadow); }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  form button { width: 48px; height: 48px; flex: none; border: none; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 18px; cursor: pointer; box-shadow: var(--shadow); }
  form button:disabled { opacity: .45; cursor: default; }
  .foot { text-align: center; font-size: 11.5px; color: var(--muted); padding: 0 18px 12px; }

  /* ── 입력 중 표시 ── */
  .dots { display: flex; gap: 4px; padding: 4px 2px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; }
  .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

  /* ── 마크다운 ── */
  .bot p { margin: 0 0 8px; } .bot p:last-child { margin-bottom: 0; }
  .bot ul, .bot ol { margin: 4px 0 8px; padding-left: 20px; }
  .bot li { margin: 3px 0; }
  .bot a { color: var(--accent); word-break: break-all; }
  .bot h1, .bot h2, .bot h3 { font-size: 15px; margin: 10px 0 4px; }
  .bot code { background: var(--accent-soft); padding: 1px 5px; border-radius: 5px; font-size: 13px; }
  .bot table { border-collapse: collapse; font-size: 13.5px; margin: 6px 0; display: block; overflow-x: auto; }
  .bot th, .bot td { border: 1px solid var(--border); padding: 5px 9px; text-align: left; }
  .bot th { background: var(--accent-soft); }

  /* ── 캠퍼스 지도 ── */
  .mapbox { margin-top: 10px; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: var(--panel); }
  .mapbox .frame { position: relative; line-height: 0; cursor: zoom-in; }
  .mapbox img { width: 100%; height: auto; display: block; }
  .mapbox .cap { font-size: 12px; color: var(--muted); padding: 7px 11px; line-height: 1.4;
    display: flex; justify-content: space-between; gap: 8px; }
  .mapbox .cap a { color: var(--accent); white-space: nowrap; }
  .pin { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 4px; pointer-events: none; }
  .pin b { width: 22px; height: 22px; border-radius: 50%; background: var(--pin); color: #fff; font-size: 11px;
    display: flex; align-items: center; justify-content: center; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .pin em { font-style: normal; font-size: 11px; font-weight: 700; color: #fff; background: var(--pin);
    padding: 2px 6px; border-radius: 10px; white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .pin.ping b { animation: ping 1.6s ease-out 3; }
  @keyframes ping { 0%, 100% { box-shadow: 0 1px 4px rgba(0,0,0,.4); } 50% { box-shadow: 0 0 0 8px rgba(232,80,91,.35); } }

  dialog { border: none; border-radius: 16px; padding: 0; background: var(--panel); color: var(--text);
    width: min(96vw, 940px); max-height: 94vh; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog .head { display: flex; align-items: center; gap: 10px; padding: 11px 15px; border-bottom: 1px solid var(--border); }
  dialog .head strong { font-size: 15px; }
  dialog .head .close { margin-left: auto; background: none; border: none; color: var(--muted);
    font-size: 20px; padding: 0 6px; cursor: pointer; }
  dialog .body { overflow: hidden; max-height: 80vh; }
  dialog .frame { position: relative; line-height: 0; width: 100%; }
  dialog .frame img { width: 100%; height: auto; display: block; }

  /* 확대·이동 (휠/핀치 줌, 드래그) */
  .zoomwrap { position: relative; overflow: hidden; touch-action: none; cursor: grab; background: var(--bg);
    height: min(72vh, 640px); user-select: none; -webkit-user-select: none; }
  .zoomwrap img { -webkit-user-drag: none; user-drag: none; pointer-events: none; }
  .zoomwrap.grabbing { cursor: grabbing; }
  .zoomwrap > .pz { transform-origin: 0 0; will-change: transform; }
  .zoomwrap > .pz img { width: 100%; height: auto; display: block; }
  .zoomctl { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 6px; z-index: 3; }
  .zoomctl button { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 16px; line-height: 1; cursor: pointer;
    box-shadow: var(--shadow); display: grid; place-items: center; padding: 0; }
  .zoomctl button:hover { border-color: var(--accent); color: var(--accent); }
  .binfo { position: absolute; left: 12px; top: 12px; z-index: 4; width: min(300px, calc(100% - 24px));
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow);
    padding: 12px 14px; max-height: calc(100% - 24px); overflow-y: auto; }
  .binfo h4 { margin: 0 0 2px; font-size: 15px; }
  .binfo .num { font-size: 11.5px; color: #fff; background: var(--pin); border-radius: 999px; padding: 1px 8px; margin-right: 6px; }
  .binfo .orgs { font-size: 12.5px; color: var(--accent); margin: 6px 0 0; line-height: 1.5; }
  .binfo .note { font-size: 12.5px; color: var(--red); margin: 7px 0 0; line-height: 1.5; }
  .binfo ul { list-style: none; margin: 8px 0 0; padding: 0; }
  .binfo li { font-size: 12.5px; color: var(--muted); padding: 3px 0; border-top: 1px solid var(--border); }
  .binfo .close2 { position: absolute; right: 8px; top: 8px; background: none; border: none; color: var(--muted);
    font-size: 15px; cursor: pointer; padding: 2px 5px; }
  .binfo .more2 { font-size: 11.5px; color: var(--muted); margin-top: 7px; }
  .binfo .moreBtn { margin-top: 10px; width: 100%; background: var(--accent-soft); color: var(--accent);
    border: none; border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-family: inherit; cursor: pointer; }
  .binfo .moreBtn:hover { filter: brightness(.96); }
  /* 벡터(상세) 캠퍼스 지도 */
  #mapVector { width: 100%; }
  #mapVector svg { width: 100%; height: auto; display: block; }
  .v-bg { fill: #eef5ea; }
  .v-green { fill: #d7ead2; }
  .v-pitch { fill: #cfe3bd; }
  .v-water { fill: #bfdcf0; }
  .v-parking { fill: #e6e6e2; }
  .v-road { stroke: #ffffff; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .v-foot { stroke: #f3ece2; fill: none; stroke-linecap: round; stroke-dasharray: 5 4; }
  .v-bld { fill: #cfd6e4; stroke: #a9b3c6; stroke-width: 1; }
  .v-bld.known { fill: #b9c6e8; stroke: #7f91c4; cursor: pointer; }
  .v-bld.known:hover { fill: var(--accent); stroke: var(--accent); }
  .v-label { font: 600 9px -apple-system, "Malgun Gothic", sans-serif; fill: #3a4253; text-anchor: middle; pointer-events: none; }
  .v-num { font: 700 9px sans-serif; fill: #fff; text-anchor: middle; pointer-events: none; }
  .v-numbg { fill: var(--pin); }
  .v-poi text { font-size: 11px; text-anchor: middle; }
  @media (prefers-color-scheme: dark) {
    .v-bg { fill: #1b2a22; } .v-green { fill: #22362a; } .v-pitch { fill: #284031; }
    .v-water { fill: #1e3a4d; } .v-parking { fill: #262a31; }
    .v-road { stroke: #39414f; } .v-foot { stroke: #333b47; }
    .v-bld { fill: #3a4457; stroke: #4d5a72; } .v-bld.known { fill: #4a5c86; stroke: #6c80ad; }
    .v-label { fill: #c7d0e0; }
  }
  .poitoggle { position: absolute; left: 12px; top: 12px; z-index: 4; font-size: 12px; font-family: inherit;
    background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 12px; cursor: pointer; box-shadow: var(--shadow); }
  .poifilter { position: absolute; left: 12px; top: 46px; z-index: 3; display: flex; flex-wrap: wrap; gap: 5px;
    width: min(330px, calc(100% - 24px)); background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 9px; box-shadow: var(--shadow); }
  .poifilter button { font-size: 11.5px; font-family: inherit; border: 1px solid var(--border);
    background: var(--panel); color: var(--muted); border-radius: 999px; padding: 4px 9px; cursor: pointer; opacity: .9; }
  .poifilter button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
  .zoomhint { position: absolute; left: 12px; bottom: 14px; z-index: 3; font-size: 11.5px; color: var(--muted);
    background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; opacity: .92; }

  /* ── 홈 대시보드 ── */
  [hidden] { display: none !important; }   /* #chat 의 display:flex 가 hidden 을 이기지 못하도록 */
  .tabs { display: flex; gap: 4px; background: var(--accent-soft); padding: 3px; border-radius: 999px; }
  .tabs button { background: none; border: none; color: var(--muted); font-size: 13px; font-family: inherit;
    padding: 6px 14px; border-radius: 999px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--panel); color: var(--accent); font-weight: 700; box-shadow: var(--shadow); }

  #home { flex: 1; overflow-y: auto; padding: 20px 18px 8px; max-width: 980px; width: 100%; margin: 0 auto; }
  .hero { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
  .hero img { width: 92px; height: 92px; object-fit: contain; animation: float 3.6s ease-in-out infinite; flex: none; }
  .hero h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: -.3px; }
  .hero p { margin: 0; color: var(--muted); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; align-items: start; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: var(--shadow); overflow: hidden; }
  .card > h3 { margin: 0; padding: 13px 16px 10px; font-size: 14.5px; display: flex; align-items: center; gap: 7px; }
  .card > h3 span.more { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--muted); }
  .card ul { list-style: none; margin: 0; padding: 0 16px 14px; }
  .card li { padding: 8px 0; border-top: 1px solid var(--border); font-size: 13.5px; line-height: 1.5; }
  .card li:first-child { border-top: none; }
  .card a { color: inherit; text-decoration: none; display: block; }
  .card a:hover { color: var(--accent); }
  .meal { display: flex; gap: 9px; }
  .meal b { flex: none; width: 32px; color: var(--accent); font-size: 12.5px; padding-top: 1px; }
  .dorm-tabs { display: flex; gap: 6px; padding: 0 16px 10px; flex-wrap: wrap; }
  .dorm-tabs button { font-size: 12px; font-family: inherit; border: 1px solid var(--border); background: var(--bg);
    color: var(--muted); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
  .dorm-tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
  .dday { display: inline-block; min-width: 46px; font-size: 11.5px; font-weight: 700; color: #fff;
    background: var(--accent); border-radius: 999px; padding: 1px 7px; margin-right: 7px; text-align: center; }
  .dday.soon { background: var(--red); }
  .tag { font-size: 11px; color: var(--muted); background: var(--accent-soft); border-radius: 5px;
    padding: 1px 6px; margin-right: 6px; }
  .links-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 8px; padding: 0 16px 16px; }
  .links-grid a { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 11px 6px;
    border: 1px solid var(--border); border-radius: 12px; font-size: 12.5px; text-decoration: none; color: var(--text);
    transition: transform .12s, border-color .12s; }
  .links-grid a:hover { transform: translateY(-2px); border-color: var(--accent); color: var(--accent); }
  .links-grid a i { font-style: normal; font-size: 19px; }
  .empty { color: var(--muted); font-size: 13px; padding: 2px 0 10px; }
  .stamp { text-align: center; font-size: 11.5px; color: var(--muted); padding: 16px 0 6px; }

  @media (max-width: 700px) {
    .row { max-width: 94%; }
    header .who p { display: none; }
    .welcome img { width: 104px; height: 104px; }
    .hero img { width: 72px; height: 72px; }
    .hero h2 { font-size: 18px; }
    /* 좁은 화면(터치)에서는 한 줄로 두고 손가락으로 쓸어서 넘긴다 */
    #quickbar .chips { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start;
      scrollbar-width: none; -ms-overflow-style: none; }
    #quickbar .chips::-webkit-scrollbar { display: none; }
    #quickbar .chips button { flex: none; padding: 6px 11px; font-size: 12.5px; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js"></script>
</head>
<body>
<header>
  <span class="face"><img src="/static/img/kwakbot-small.png" alt=""></span>
  <div class="who">
    <h1>곽봇</h1>
    <p>서울과학기술대학교 안내 챗봇</p>
  </div>
  <div class="tabs" role="tablist">
    <button id="tabHome" type="button" role="tab" aria-selected="true">홈</button>
    <button id="tabChat" type="button" role="tab" aria-selected="false">대화</button>
  </div>
  <nav class="links">
    <button id="mapBtn" type="button">🗺 캠퍼스 지도</button>
  </nav>
</header>

<div id="home">
  <div class="hero">
    <img src="/static/img/kwakbot.png" alt="곽봇 마스코트">
    <div>
      <h2>안녕하세요, 곽봇이에요!</h2>
      <p id="heroSub">서울과기대 소식을 모아서 보여드릴게요.</p>
    </div>
  </div>
  <div class="grid" id="cards"></div>
  <div class="stamp" id="stamp"></div>
</div>

<div id="chat" hidden>
  <div class="welcome" id="welcome">
    <img src="/static/img/kwakbot.png" alt="곽봇 마스코트">
    <h2>무엇이든 물어보세요</h2>
    <p>학사·식단·장학·건물 위치까지, 아는 만큼 알려드려요.</p>
  </div>
</div>

<div id="quickbar">
  <div class="chips">
      <button type="button" data-q="오늘 기숙사 식당 점심 뭐야?"><b>식단</b>오늘 점심 뭐야?</button>
      <button type="button" data-q="컴퓨터공학과 사무실 어디야?"><b>위치</b>학과 사무실 어디야?</button>
      <button type="button" data-q="24학번인데 졸업요건 알려줘"><b>졸업</b>졸업요건 알려줘</button>
      <button type="button" data-q="장학금 관련 최근 공지 있어?"><b>장학</b>최근 장학 공지</button>
      <button type="button" data-q="수강신청 사이트 알려줘"><b>수강</b>수강신청 사이트</button>
      <button type="button" data-q="일반휴학 어떻게 신청해?"><b>학사</b>휴학 신청 방법</button>
  </div>
</div>

<form id="form">
  <input id="input" type="text" placeholder="궁금한 걸 물어보세요..." autocomplete="off" autofocus>
  <button id="send" type="submit" aria-label="보내기">↑</button>
</form>
<div class="foot">곽봇은 학교 홈페이지 자료를 바탕으로 답해요. 중요한 내용은 담당 부서에서 꼭 확인하세요.</div>

<dialog id="mapDlg">
  <div class="head">
    <strong>캠퍼스 지도</strong>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
let welcome = document.getElementById("welcome");
const history = [];

// ---- 캠퍼스 지도 데이터 (app/campus_map.py 가 생성) ----
let MAP = null;
// 수집기가 주기적으로 갱신하므로 캐시를 쓰지 않고 매번 서버에 확인한다
fetch('/static/campus_buildings.json', { cache: 'no-cache' })
  .then(r => r.ok ? r.json() : null).then(d => { MAP = d; }).catch(() => {});

const LOCATION_Q = /어디\s*(있|야|에|냐|쯤|인가)|어딨|위치|찾아가|가는\s*법|건물|호실|몇\s*층|지도|캠퍼스/;

function findBuildings(text, question) {
  if (!MAP) return [];
  const hasBuildingNo = /\d{1,2}\s*번/.test(text);
  if (!hasBuildingNo && !(question && LOCATION_Q.test(question))) return [];
  const byNum = new Map(MAP.buildings.map(b => [b.num, b]));
  const found = new Map();
  const names = MAP.buildings.map(b => [b.name, b.num])
    .concat(Object.entries(MAP.aliases))
    .sort((a, b) => b[0].length - a[0].length);
  let rest = text;
  for (const [name, num] of names) {
    if (name.length >= 2 && rest.includes(name) && byNum.has(num)) {
      found.set(num, byNum.get(num));
      rest = rest.split(name).join(' ');
    }
  }
  for (const m of text.matchAll(/(\d{1,2})\s*번/g)) {
    if (byNum.has(m[1])) found.set(m[1], byNum.get(m[1]));
  }
  return [...found.values()].slice(0, 5);
}

function renderPins(frame, pins, opts) {
  opts = opts || {};
  for (const b of pins) {
    const el = document.createElement('div');
    el.className = 'pin' + (opts.ping ? ' ping' : '');
    el.style.left = (b.x / MAP.width * 100) + '%';
    el.style.top = (b.y / MAP.height * 100) + '%';
    const num = document.createElement('b');
    num.textContent = b.num;
    el.appendChild(num);
    if (opts.label) {
      const name = document.createElement('em');
      name.textContent = b.name;
      el.appendChild(name);
    }
    frame.appendChild(el);
  }
}

function mapImage() {
  const img = document.createElement('img');
  img.src = MAP.image;
  img.alt = '서울과학기술대학교 캠퍼스 지도';
  return img;
}

function buildMapBox(pins) {
  const box = document.createElement('div');
  box.className = 'mapbox';
  const frame = document.createElement('div');
  frame.className = 'frame';
  frame.appendChild(mapImage());
  renderPins(frame, pins, { label: true, ping: true });
  frame.addEventListener('click', () => openMapDialog(pins));

  const cap = document.createElement('div');
  cap.className = 'cap';
  const who = document.createElement('span');
  who.textContent = pins.map(b => b.num + '번 ' + b.name).join(' · ') + ' (클릭하면 크게)';
  const link = document.createElement('a');
  link.href = MAP.page; link.target = '_blank'; link.rel = 'noopener';
  link.textContent = '층별 안내 보기';
  cap.append(who, link);

  box.append(frame, cap);
  return box;
}

// ---- 확대·이동 (휠/핀치 줌, 드래그) ----
const UI_IN_WRAP = '[data-zoom], .binfo, .poifilter, .poitoggle';   // 지도 위에 떠 있는 조작 요소들

function makePanZoom(wrap, { min = 1, max = 8, onTap = null } = {}) {
  // min 은 reset() 에서 화면에 맞춰 다시 계산된다
  const content = wrap.querySelector('.pz');
  let scale = 1, tx = 0, ty = 0;

  const apply = () => {
    const w = wrap.clientWidth, h = wrap.clientHeight;
    const cw = content.offsetWidth * scale, ch = content.offsetHeight * scale;
    // 화면보다 작으면 가운데로, 크면 빈 공간이 생기지 않게 가둔다
    tx = cw <= w ? (w - cw) / 2 : Math.min(0, Math.max(w - cw, tx));
    ty = ch <= h ? (h - ch) / 2 : Math.min(0, Math.max(h - ch, ty));
    content.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  };

  // (cx, cy) 지점을 고정한 채 확대·축소
  const zoomAt = (factor, cx, cy) => {
    const next = Math.min(max, Math.max(min, scale * factor));
    const ratio = next / scale;
    tx = cx - (cx - tx) * ratio;
    ty = cy - (cy - ty) * ratio;
    scale = next;
    apply();
  };

  // 세로가 넘칠 때는 전체가 보이도록 줄여서 시작하고, 그 배율을 최소 배율로 삼는다
  const fitScale = () => {
    const h = wrap.clientHeight, ch = content.offsetHeight;
    return ch && ch > h ? Math.max(0.2, h / ch) : 1;
  };
  const reset = () => { min = fitScale(); scale = min; tx = ty = 0; apply(); };

  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    const r = wrap.getBoundingClientRect();
    zoomAt(e.deltaY < 0 ? 1.18 : 1 / 1.18, e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });

  wrap.addEventListener('dblclick', e => {
    const r = wrap.getBoundingClientRect();
    zoomAt(scale >= max - 0.01 ? min / scale : 1.8, e.clientX - r.left, e.clientY - r.top);
  });

  // 드래그(한 손가락) + 핀치(두 손가락)
  const pointers = new Map();
  let last = null, pinch = 0, moved = 0, downAt = null;

  wrap.addEventListener('dragstart', e => e.preventDefault());
  wrap.addEventListener('pointerdown', e => {
    if (e.target.closest(UI_IN_WRAP)) return;   // 버튼·정보 카드 클릭은 드래그로 보지 않는다
    e.preventDefault();
    wrap.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    last = { x: e.clientX, y: e.clientY };
    moved = 0;
    downAt = { x: e.clientX, y: e.clientY };
    wrap.classList.add('grabbing');
  });

  wrap.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pointers.size >= 2) {
      const [a, b] = [...pointers.values()];
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinch) {
        const r = wrap.getBoundingClientRect();
        zoomAt(dist / pinch, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
      }
      pinch = dist;
      return;
    }
    if (last) {
      moved += Math.abs(e.clientX - last.x) + Math.abs(e.clientY - last.y);
      tx += e.clientX - last.x;
      ty += e.clientY - last.y;
      last = { x: e.clientX, y: e.clientY };
      apply();
    }
  });

  const release = e => {
    // 거의 움직이지 않았다면 클릭으로 보고, 콘텐츠 기준 좌표를 넘긴다
    if (onTap && downAt && moved < 6 && pointers.size === 1 && !e.target.closest(UI_IN_WRAP)) {
      const r = wrap.getBoundingClientRect();
      onTap((e.clientX - r.left - tx) / scale, (e.clientY - r.top - ty) / scale, content);
    }
    downAt = null;
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = 0;
    if (!pointers.size) { last = null; wrap.classList.remove('grabbing'); }
  };
  wrap.addEventListener('pointerup', release);
  wrap.addEventListener('pointercancel', release);

  wrap.querySelectorAll('[data-zoom]').forEach(btn => {
    btn.addEventListener('click', () => {
      const kind = btn.dataset.zoom;
      if (kind === 'reset') return reset();
      zoomAt(kind === 'in' ? 1.5 : 1 / 1.5, wrap.clientWidth / 2, wrap.clientHeight / 2);
    });
  });

  return { reset, apply };
}

const dlg = document.getElementById('mapDlg');
const dlgFrame = document.getElementById('mapDlgFrame');
const mapZoomEl = document.getElementById('mapZoom');

// 지도에서 누른 지점과 가장 가까운 건물 핀을 찾아 정보 카드를 띄운다
function showBuildingInfo(b) {
  mapZoomEl.querySelector('.binfo')?.remove();
  const box = el('div', 'binfo');
  const close = el('button', 'close2', '✕');
  close.type = 'button';
  close.addEventListener('click', () => box.remove());

  const title = el('h4');
  title.append(el('span', 'num', b.num + '번'), document.createTextNode(b.name));
  box.append(close, title);

  if (b.note) box.append(el('p', 'note', '※ ' + b.note));

  // 호실을 바로 쏟지 않고, 어떤 학과·기관이 있는지만 먼저 보여준다
  const summary = [...(b.depts || []), ...(b.orgs || []).filter(o => !(b.depts || []).includes(o))];
  if (summary.length) box.append(el('p', 'orgs', summary.join(' · ')));
  else if (!b.note) box.append(el('p', 'more2', '이 건물의 입주 정보는 자료에 없어요.'));

  if (b.rooms?.length) {
    const toggle = el('button', 'moreBtn', `정보 더보기 (호실 ${b.roomCount}개) ▾`);
    toggle.type = 'button';
    const list = el('ul');
    list.hidden = true;
    b.rooms.forEach(r => list.append(el('li', null, r)));
    if (b.roomCount > b.rooms.length) {
      list.append(el('li', 'more2', `그 외 ${b.roomCount - b.rooms.length}개 호실은 학교 캠퍼스지도에서 확인하세요.`));
    }
    toggle.addEventListener('click', () => {
      list.hidden = !list.hidden;
      toggle.textContent = (list.hidden ? '정보 더보기' : '접기') + ` (호실 ${b.roomCount}개) ` + (list.hidden ? '▾' : '▴');
    });
    box.append(toggle, list);
  }
  mapZoomEl.append(box);
}

function pickBuilding(cx, cy, content) {
  if (!MAP) return;
  // 콘텐츠 좌표(px) → 지도 원본 좌표(900x582) 로 환산
  const sx = MAP.width / content.offsetWidth, sy = MAP.height / content.offsetHeight;
  const mx = cx * sx, my = cy * sy;
  let best = null, bestDist = Infinity;
  for (const b of MAP.buildings) {
    const d = Math.hypot(b.x - mx, b.y - my);
    if (d < bestDist) { best = b; bestDist = d; }
  }
  if (best && bestDist < 26) showBuildingInfo(best);
  else mapZoomEl.querySelector('.binfo')?.remove();
}

const mapPanZoom = makePanZoom(mapZoomEl, { onTap: pickBuilding });

// ---- 상세(벡터) 캠퍼스 지도 : OSM 자료를 SVG 로 직접 그린다 ----
const SVG_NS = 'http://www.w3.org/2000/svg';
const vectorEl = document.getElementById('mapVector');
const poiFilterEl = document.getElementById('poiFilter');
let VEC = null, poiOn = new Set(['편의점', '카페', '식당', '버스정류장']);

const svgEl = (tag, attrs = {}) => {
  const n = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
};

function drawVectorMap() {
  if (!VEC) return;
  const box = VEC.focus || [0, 0, VEC.width, VEC.height];
  const svg = svgEl('svg', { viewBox: box.join(' ') });
  svg.append(svgEl('rect', { class: 'v-bg', x: box[0], y: box[1], width: box[2], height: box[3] }));

  for (const a of VEC.areas) {
    svg.append(svgEl('polygon', { class: 'v-' + a.kind, points: a.pts.map(p => p.join(',')).join(' ') }));
  }
  for (const p of VEC.paths) {
    svg.append(svgEl('polyline', {
      class: 'v-' + p.kind, points: p.pts.map(q => q.join(',')).join(' '),
      'stroke-width': p.kind === 'road' ? 5 : 2,
    }));
  }
  for (const b of VEC.buildings) {
    const poly = svgEl('polygon', {
      class: 'v-bld' + (b.num ? ' known' : ''),
      points: b.pts.map(p => p.join(',')).join(' '),
    });
    if (b.num) {
      poly.addEventListener('click', () => {
        const info = MAP?.buildings.find(x => x.num === b.num);
        if (info) showBuildingInfo(info);
      });
      const tip = svgEl('title');
      tip.textContent = `${b.num}번 ${b.name}`;
      poly.append(tip);
    }
    svg.append(poly);
  }
  // 건물 이름·번호
  for (const b of VEC.buildings) {
    if (!b.name) continue;
    const cx = b.pts.reduce((s2, p) => s2 + p[0], 0) / b.pts.length;
    const cy = b.pts.reduce((s2, p) => s2 + p[1], 0) / b.pts.length;
    if (b.num) {
      svg.append(svgEl('circle', { class: 'v-numbg', cx, cy: cy - 7, r: 7 }));
      const num = svgEl('text', { class: 'v-num', x: cx, y: cy - 4 });
      num.textContent = b.num;
      svg.append(num);
    }
    const label = svgEl('text', { class: 'v-label', x: cx, y: cy + 10 });
    label.textContent = b.name;
    svg.append(label);
  }
  // 편의시설
  for (const p of VEC.pois) {
    if (!poiOn.has(p.label)) continue;
    const g = svgEl('g', { class: 'v-poi' });
    const icon = svgEl('text', { x: p.pt[0], y: p.pt[1] });
    icon.textContent = p.icon;
    g.append(icon);
    const tip = svgEl('title');
    tip.textContent = p.name ? `${p.label} · ${p.name}` : p.label;
    g.append(tip);
    svg.append(g);
  }
  vectorEl.replaceChildren(svg);
}

function drawPoiFilter() {
  if (!VEC) return;
  const kinds = [...new Set(VEC.pois.map(p => p.label))];
  poiFilterEl.replaceChildren(...kinds.map(label => {
    const count = VEC.pois.filter(p => p.label === label).length;
    const b = el('button', null, `${VEC.pois.find(p => p.label === label).icon} ${label} ${count}`);
    b.type = 'button';
    b.setAttribute('aria-pressed', String(poiOn.has(label)));
    b.addEventListener('click', () => {
      poiOn.has(label) ? poiOn.delete(label) : poiOn.add(label);
      b.setAttribute('aria-pressed', String(poiOn.has(label)));
      drawVectorMap();
    });
    return b;
  }));
}

fetch('/static/campus_vector.json', { cache: 'no-cache' })
  .then(r => r.ok ? r.json() : null)
  .then(d => { VEC = d; if (d) { drawVectorMap(); drawPoiFilter(); setMapMode(mapMode); } })
  .catch(() => {});

// 상세 지도 / 일러스트 전환
let mapMode = 'vector';
function setMapMode(mode) {
  mapMode = VEC ? mode : 'image';
  vectorEl.hidden = mapMode !== 'vector';
  dlgFrame.hidden = mapMode === 'vector';
  document.getElementById('poiToggle').hidden = mapMode !== 'vector';
  poiFilterEl.hidden = true;
  document.querySelectorAll('#mapModeTabs button').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.mode === mapMode)));
  mapPanZoom.reset();
}
document.querySelectorAll('#mapModeTabs button').forEach(b =>
  b.addEventListener('click', () => setMapMode(b.dataset.mode)));

const poiToggle = document.getElementById('poiToggle');
poiToggle.addEventListener('click', () => {
  poiFilterEl.hidden = !poiFilterEl.hidden;
  poiToggle.textContent = '🏪 편의시설 ' + (poiFilterEl.hidden ? '▾' : '▴');
});
function openMapDialog(pins) {
  if (!MAP) return;
  const marked = pins && pins.length;
  dlgFrame.replaceChildren(mapImage());
  renderPins(dlgFrame, marked ? pins : MAP.buildings, { label: !!marked, ping: !!marked });
  mapZoomEl.querySelector('.binfo')?.remove();
  dlg.showModal();
  mapPanZoom.reset();
  // 지도 이미지가 아직 로드되지 않았으면 높이를 알 수 없으므로 로드 후 한 번 더 맞춘다
  const mapImg = dlgFrame.querySelector('img');
  if (mapImg && !mapImg.complete) mapImg.addEventListener('load', mapPanZoom.reset, { once: true });
}
document.getElementById('mapBtn').addEventListener('click', () => openMapDialog(null));
dlg.querySelector('.close').addEventListener('click', () => dlg.close());
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

// ---- 말풍선 ----
// 자동 링크가 뒤따르는 한글 조사나 닫는 괄호까지 삼키는 문제를 바로잡는다.
// 예: "(https://www.seoultech.ac.kr)에서" → 링크에 ")에서" 가 포함돼 주소가 깨짐
const LINK_TAIL = /[가-힣ㄱ-ㅎㅏ-ㅣ)\]}>,.;:!?'"」』]+$/;

function trimAutoLinks(root) {
  for (const a of root.querySelectorAll('a[href]')) {
    let href = a.getAttribute('href');
    let decoded;
    try { decoded = decodeURI(href); } catch { continue; }
    // [텍스트](주소) 형태는 손대지 않는다 — 글자가 그대로 드러난 자동 링크만 다듬는다
    if (a.textContent !== decoded && a.textContent !== href) continue;
    const tail = (decoded.match(LINK_TAIL) || [''])[0];
    if (!tail) continue;
    const clean = decoded.slice(0, decoded.length - tail.length);
    if (!/^https?:\/\/[^/]+/.test(clean)) continue;
    a.setAttribute('href', clean);
    a.textContent = clean;
    a.after(document.createTextNode(tail));
  }
}

function renderMd(text) {
  const holder = document.createElement('div');
  holder.innerHTML = DOMPurify.sanitize(window.marked.parse(text, { breaks: true }));
  trimAutoLinks(holder);
  for (const a of holder.querySelectorAll('a')) {
    a.target = '_blank';
    a.rel = 'noopener';
  }
  return holder.innerHTML;
}

function addRow(role) {
  const row = document.createElement('div');
  row.className = 'row' + (role === 'user' ? ' me' : '');
  if (role === 'bot') {
    const av = document.createElement('div');
    av.className = 'avatar';
    const img = document.createElement('img');
    img.src = '/static/img/kwakbot-small.png';
    img.alt = '곽봇';
    av.appendChild(img);
    row.appendChild(av);
  }
  const msg = document.createElement('div');
  msg.className = 'msg ' + role;
  row.appendChild(msg);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return { row, msg };
}

function addError(text) {
  const el = document.createElement('div');
  el.className = 'error';
  el.textContent = '⚠ ' + text;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
}

function typingDots() {
  const d = document.createElement('div');
  d.className = 'dots';
  d.innerHTML = '<i></i><i></i><i></i>';
  return d;
}

// ---- 전송 ----
async function send(text) {
  text = text.trim();
  if (!text || sendBtn.disabled) return;
  showView('chat');
  welcome?.remove();
  input.value = '';
  sendBtn.disabled = true;

  addRow('user').msg.textContent = text;
  history.push({ role: 'user', content: text });

  const { row, msg } = addRow('bot');
  msg.appendChild(typingDots());
  let reply = '';

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history }),
    });
    if (!res.ok) throw new Error('서버 오류 ' + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6);
        if (payload === '[DONE]') continue;
        const data = JSON.parse(payload);
        if (data.error) throw new Error(data.error);
        reply += data.text;
        msg.innerHTML = renderMd(reply);
        chat.scrollTop = chat.scrollHeight;
      }
    }
    if (reply) {
      history.push({ role: 'assistant', content: reply });
      const pins = findBuildings(reply, text);
      if (pins.length) {
        msg.appendChild(buildMapBox(pins));
        chat.scrollTop = chat.scrollHeight;
      }
    } else {
      row.remove();
    }
  } catch (err) {
    row.remove();
    history.pop();
    addError(err.message);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

const homeView = document.getElementById('home');
const tabHome = document.getElementById('tabHome');
const tabChat = document.getElementById('tabChat');

function showView(name) {
  const isHome = name === 'home';
  homeView.hidden = !isHome;
  chat.hidden = isHome;
  tabHome.setAttribute('aria-selected', String(isHome));
  tabChat.setAttribute('aria-selected', String(!isHome));
  input.placeholder = isHome ? '곽봇에게 물어보기...' : '궁금한 걸 물어보세요...';
}
tabHome.addEventListener('click', () => showView('home'));

// ---- 이미지 팝업 (테크노파크 주간 식단표처럼 이미지로만 오는 자료) ----
const imgDlg = document.getElementById('imgDlg');
const imgDlgImg = document.getElementById('imgDlgImg');
const imgPanZoom = makePanZoom(document.getElementById('imgZoom'));

function openImageDialog({ title, image, url, date }) {
  document.getElementById('imgDlgTitle').textContent = title + (date ? ` (${date})` : '');
  const link = document.getElementById('imgDlgLink');
  link.href = url || '#';
  link.hidden = !url;
  imgDlgImg.src = image;
  imgDlgImg.alt = title;
  imgDlg.showModal();
  imgDlgImg.complete ? imgPanZoom.reset() : imgDlgImg.addEventListener('load', imgPanZoom.reset, { once: true });
}
imgDlg.querySelector('.close').addEventListener('click', () => imgDlg.close());
imgDlg.addEventListener('click', e => { if (e.target === imgDlg) imgDlg.close(); });

// ---- 홈 카드 ----
// 함수 선언이라 위쪽(지도 정보 카드)에서도 쓸 수 있다
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

function card(title, icon, more) {
  const box = el('div', 'card');
  const h = el('h3');
  h.append(el('span', null, icon), el('span', null, title));
  if (more) h.append(el('span', 'more', more));
  box.append(h);
  return box;
}

function menuCard(menu, tp) {
  const box = card('오늘 식단', '🍚', '생활관 · 테크노파크');
  const tabs = el('div', 'dorm-tabs');
  const body = el('div');

  // 생활관 식당들 + (있으면) 테크노파크 주간 식단표 이미지
  const views = menu.map(m => ({ label: m.name.replace(' 식당', ''), title: m.who, draw: () => {
    const list = el('ul');
    for (const [meal, text] of Object.entries(m.meals)) {
      const li = el('li');
      const wrap = el('div', 'meal');
      wrap.append(el('b', null, meal), el('span', null, text));
      li.append(wrap);
      list.append(li);
    }
    return list;
  }}));

  if (tp && tp.image) {
    views.push({ label: '테크노파크', title: '서울테크노파크(7번) 구내식당', draw: () => {
      const wrap = el('div');
      wrap.style.padding = '0 16px 14px';
      const img = el('img');
      img.src = tp.image;
      img.alt = tp.title;
      img.loading = 'lazy';
      img.style.cssText = 'width:100%;border-radius:10px;border:1px solid var(--border);display:block;cursor:zoom-in';
      img.addEventListener('click', () => openImageDialog(tp));
      const cap = el('div', null, `${tp.title} · ${tp.date} 게시 (클릭하면 크게)`);
      cap.style.cssText = 'font-size:11.5px;color:var(--muted);margin-top:6px';
      wrap.append(img, cap);
      return wrap;
    }});
  }

  if (!views.length) {
    const empty = el('div', 'empty', '오늘은 식단이 올라오지 않았어요. (주말·공휴일이거나 아직 미게시)');
    empty.style.padding = '0 16px 16px';
    box.append(empty);
    return box;
  }

  const draw = (i) => {
    [...tabs.children].forEach((b, n) => b.setAttribute('aria-selected', String(n === i)));
    body.replaceChildren(views[i].draw());
  };
  views.forEach((v, i) => {
    const b = el('button', null, v.label);
    b.type = 'button';
    b.title = v.title;
    b.addEventListener('click', () => draw(i));
    tabs.append(b);
  });
  box.append(tabs, body);
  draw(0);
  return box;
}

function scheduleCard(items) {
  const box = card('다가오는 학사일정', '📅', '학부');
  const list = el('ul');
  for (const it of items) {
    const li = el('li');
    const dday = el('span', 'dday' + (it.dday <= 3 ? ' soon' : ''), it.dday === 0 ? 'D-DAY' : 'D-' + it.dday);
    li.append(dday, el('span', null, `${it.month}/${it.day}(${it.weekday}) ${it.title}`));
    list.append(li);
  }
  box.append(items.length ? list : el('div', 'empty', '다가오는 일정이 없어요.'));
  return box;
}

function noticeCard(items) {
  const box = card('최근 공지', '📢');
  const list = el('ul');
  for (const it of items) {
    const li = el('li');
    const a = el('a');
    a.href = it.url; a.target = '_blank'; a.rel = 'noopener';
    a.append(el('span', 'tag', it.board.replace('사항', '')), el('span', null, it.title));
    const sub = el('div', null, `${it.date} · ${it.dept}`);
    sub.style.cssText = 'font-size:11.5px;color:var(--muted);margin-top:3px';
    a.append(sub);
    li.append(a);
    list.append(li);
  }
  box.append(items.length ? list : el('div', 'empty', '공지를 불러오지 못했어요.'));
  return box;
}

function linkCard(items) {
  const box = card('자주 가는 곳', '🔗');
  const grid = el('div', 'links-grid');
  for (const it of items) {
    const a = el('a');
    a.href = it.url; a.target = '_blank'; a.rel = 'noopener';
    a.append(el('i', null, it.icon), el('span', null, it.label));
    grid.append(a);
  }
  box.append(grid);
  return box;
}
