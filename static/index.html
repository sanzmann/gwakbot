<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>곽봇 - 서울과기대 챗봇</title>
<style>
  :root {
    --bg: #f4f6fa; --panel: #ffffff; --text: #1b1f27; --muted: #6b7280;
    --accent: #1e3a8a; --accent-soft: #e0e7ff; --border: #e5e7eb; --user: #1e3a8a; --bot: #f1f5f9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1117; --panel: #171a23; --text: #e6e8ee; --muted: #9aa3b2;
      --accent: #7c9cff; --accent-soft: #1f2a4d; --border: #2a2f3d; --user: #2f4fb8; --bot: #222633; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; }
  header { padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 18px; margin: 0; }
  header span { font-size: 13px; color: var(--muted); }
  header .links { margin-left: auto; display: flex; gap: 12px; }
  header .links a { font-size: 13px; color: var(--accent); text-decoration: none; }
  header .links a:hover { text-decoration: underline; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; max-width: 820px; width: 100%; margin: 0 auto; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; line-height: 1.55; word-break: break-word; font-size: 15px; }
  .user { align-self: flex-end; background: var(--user); color: #fff; border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .error { align-self: center; color: #b91c1c; font-size: 13px; }
  form { display: flex; gap: 8px; padding: 12px 20px 18px; background: var(--panel); border-top: 1px solid var(--border); max-width: 820px; width: 100%; margin: 0 auto; }
  input { flex: 1; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); font-size: 15px; }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button { padding: 0 18px; border: none; border-radius: 10px; background: var(--accent); color: #fff; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .hint { font-size: 13px; color: var(--muted); text-align: center; margin-top: 8px; }
  .bot p { margin: 0 0 8px; } .bot p:last-child { margin-bottom: 0; }
  .bot ul, .bot ol { margin: 4px 0 8px; padding-left: 20px; }
  .bot li { margin: 2px 0; }
  .bot a { color: var(--accent); word-break: break-all; }
  .bot h1, .bot h2, .bot h3 { font-size: 15px; margin: 8px 0 4px; }
  .bot code { background: rgba(127,127,127,.15); padding: 1px 4px; border-radius: 4px; font-size: 13px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js"></script>
</head>
<body>
<header>
  <h1>곽봇</h1>
  <span>서울과학기술대학교 안내 챗봇</span>
  <nav class="links">
    <a href="https://www.seoultech.ac.kr/intro/map/" target="_blank" rel="noopener">🗺 캠퍼스 지도</a>
    <a href="https://www.seoultech.ac.kr/life/sch/common/" target="_blank" rel="noopener">📅 학사일정</a>
    <a href="https://www.seoultech.ac.kr/service/info/notice/" target="_blank" rel="noopener">📢 공지사항</a>
  </nav>
</header>
<div id="chat">
  <div class="msg bot">안녕하세요, 곽봇이에요! 서울과기대에 대해 궁금한 점을 물어보세요.</div>
  <div class="hint">예: "컴퓨터공학과 사무실 어디야?", "학교에 은행 있어?", "일반휴학 어떻게 신청해?", "장학금 공지 뭐 있어?"</div>
</div>
<form id="form">
  <input id="input" type="text" placeholder="메시지를 입력하세요..." autocomplete="off" autofocus>
  <button id="send" type="submit">전송</button>
</form>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const history = [];

// 봇 답변의 마크다운을 HTML로. 링크는 새 탭에서 열리게.
function renderMd(text) {
  const html = DOMPurify.sanitize(marked.parse(text, { breaks: true }));
  return html.replace(/<a /g, '<a target="_blank" rel="noopener" ');
}

function addMsg(role, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.textContent = text;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  send.disabled = true;

  addMsg('user', text);
  history.push({ role: 'user', content: text });
  const botEl = addMsg('bot', '…');
  let reply = '';

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history }),
    });
    if (!res.ok) throw new Error('서버 오류 ' + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6);
        if (payload === '[DONE]') continue;
        const data = JSON.parse(payload);
        if (data.error) throw new Error(data.error);
        reply += data.text;
        botEl.innerHTML = renderMd(reply);
        chat.scrollTop = chat.scrollHeight;
      }
    }
    if (reply) history.push({ role: 'assistant', content: reply });
    else botEl.remove();
  } catch (err) {
    botEl.remove();
    history.pop();
    addMsg('error', '⚠ ' + err.message);
  } finally {
    send.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
