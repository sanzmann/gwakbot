<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>곽봇 - 서울과기대 챗봇</title>
<style>
  :root {
    --bg: #f4f6fa; --panel: #ffffff; --text: #1b1f27; --muted: #6b7280;
    --accent: #1e3a8a; --accent-soft: #e0e7ff; --border: #e5e7eb; --user: #1e3a8a; --bot: #f1f5f9;
    --pin: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1117; --panel: #171a23; --text: #e6e8ee; --muted: #9aa3b2;
      --accent: #7c9cff; --accent-soft: #1f2a4d; --border: #2a2f3d; --user: #2f4fb8; --bot: #222633;
      --pin: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; }
  header { padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header span { font-size: 13px; color: var(--muted); }
  header .links { margin-left: auto; display: flex; gap: 12px; }
  header .links a, header .links button { font-size: 13px; color: var(--accent); text-decoration: none; background: none; border: none; padding: 0; cursor: pointer; font-family: inherit; }
  header .links a:hover, header .links button:hover { text-decoration: underline; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; max-width: 820px; width: 100%; margin: 0 auto; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; line-height: 1.55; word-break: break-word; font-size: 15px; }
  .user { align-self: flex-end; background: var(--user); color: #fff; border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .error { align-self: center; color: #b91c1c; font-size: 13px; }
  form { display: flex; gap: 8px; padding: 12px 20px 18px; background: var(--panel); border-top: 1px solid var(--border); max-width: 820px; width: 100%; margin: 0 auto; }
  input { flex: 1; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); font-size: 15px; }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button { padding: 0 18px; border: none; border-radius: 10px; background: var(--accent); color: #fff; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .hint { font-size: 13px; color: var(--muted); text-align: center; margin-top: 8px; }
  .bot p { margin: 0 0 8px; } .bot p:last-child { margin-bottom: 0; }
  .bot ul, .bot ol { margin: 4px 0 8px; padding-left: 20px; }
  .bot li { margin: 2px 0; }
  .bot a { color: var(--accent); word-break: break-all; }
  .bot h1, .bot h2, .bot h3 { font-size: 15px; margin: 8px 0 4px; }
  .bot code { background: rgba(127,127,127,.15); padding: 1px 4px; border-radius: 4px; font-size: 13px; }

  /* 캠퍼스 지도 */
  .mapbox { margin-top: 10px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--panel); }
  .mapbox .frame { position: relative; line-height: 0; cursor: zoom-in; }
  .mapbox img { width: 100%; height: auto; display: block; }
  .mapbox .cap { font-size: 12px; color: var(--muted); padding: 6px 10px; line-height: 1.4; display: flex; justify-content: space-between; gap: 8px; }
  .mapbox .cap a { color: var(--accent); white-space: nowrap; }
  .pin { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 4px; pointer-events: none; }
  .pin b { width: 22px; height: 22px; border-radius: 50%; background: var(--pin); color: #fff; font-size: 11px;
    display: flex; align-items: center; justify-content: center; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .pin em { font-style: normal; font-size: 11px; font-weight: 700; color: #fff; background: var(--pin);
    padding: 2px 6px; border-radius: 10px; white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .pin.ping b { animation: ping 1.6s ease-out 3; }
  @keyframes ping { 0%,100% { box-shadow: 0 1px 4px rgba(0,0,0,.4); } 50% { box-shadow: 0 0 0 8px rgba(220,38,38,.35); } }

  dialog { border: none; border-radius: 12px; padding: 0; background: var(--panel); color: var(--text); width: min(96vw, 940px); max-height: 94vh; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog .head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  dialog .head strong { font-size: 15px; }
  dialog .head .close { margin-left: auto; background: none; color: var(--muted); font-size: 20px; padding: 0 6px; }
  dialog .body { overflow: auto; max-height: 80vh; }
  dialog .frame { position: relative; line-height: 0; width: 100%; }
  dialog .frame img { width: 100%; height: auto; display: block; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js"></script>
</head>
<body>
<header>
  <h1>곽봇</h1>
  <span>서울과학기술대학교 안내 챗봇</span>
  <nav class="links">
    <button id="mapBtn" type="button">🗺 캠퍼스 지도</button>
    <a href="https://www.seoultech.ac.kr/life/sch/common/" target="_blank" rel="noopener">📅 학사일정</a>
    <a href="https://www.seoultech.ac.kr/service/info/notice/" target="_blank" rel="noopener">📢 공지사항</a>
  </nav>
</header>
<div id="chat">
  <div class="msg bot">안녕하세요, 곽봇이에요! 서울과기대에 대해 궁금한 점을 물어보세요.</div>
  <div class="hint">예: "컴퓨터공학과 사무실 어디야?", "학교에 은행 있어?", "일반휴학 어떻게 신청해?", "장학금 공지 뭐 있어?"</div>
</div>
<form id="form">
  <input id="input" type="text" placeholder="메시지를 입력하세요..." autocomplete="off" autofocus>
  <button id="send" type="submit">전송</button>
</form>

<dialog id="mapDlg">
  <div class="head">
    <strong>캠퍼스 지도</strong>
    <a href="https://www.seoultech.ac.kr/intro/map/" target="_blank" rel="noopener" style="font-size:13px;color:var(--accent)">학교 홈페이지에서 보기</a>
    <button class="close" type="button" aria-label="닫기">✕</button>
  </div>
  <div class="body"><div class="frame" id="mapDlgFrame"></div></div>
</dialog>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const history = [];

// ---- 캠퍼스 지도 데이터 (app/campus_map.py 가 생성) ----
let MAP = null;
fetch('/static/campus_buildings.json').then(r => r.ok ? r.json() : null).then(d => { MAP = d; }).catch(() => {});

// 위치를 묻는 질문인지 (아니면 지도를 띄우지 않는다)
const LOCATION_Q = /어디|위치|어딨|찾아가|가는\s*법|건물|호실|몇\s*층|지도|캠퍼스/;

// 답변에 언급된 건물 찾기: 건물명과 시설 별칭을 긴 것부터, 그 다음 "NN번"
function findBuildings(text, question) {
  if (!MAP) return [];
  // 답변이 건물 번호를 명시했거나(예: "미래관(60번)"), 애초에 위치를 물은 경우에만 지도를 붙인다
  const hasBuildingNo = /\d{1,2}\s*번/.test(text);
  if (!hasBuildingNo && !(question && LOCATION_Q.test(question))) return [];
  const byNum = new Map(MAP.buildings.map(b => [b.num, b]));
  const found = new Map();
  const names = MAP.buildings.map(b => [b.name, b.num])
    .concat(Object.entries(MAP.aliases))
    .sort((a, b) => b[0].length - a[0].length);
  let rest = text;
  for (const [name, num] of names) {
    if (name.length >= 2 && rest.includes(name) && byNum.has(num)) {
      found.set(num, byNum.get(num));
      rest = rest.split(name).join(' ');   // 겹치는 짧은 이름이 또 잡히지 않게
    }
  }
  for (const m of text.matchAll(/(\d{1,2})\s*번/g)) {
    if (byNum.has(m[1])) found.set(m[1], byNum.get(m[1]));
  }
  return [...found.values()].slice(0, 5);
}

function renderPins(frame, pins, opts) {
  opts = opts || {};
  for (const b of pins) {
    const el = document.createElement('div');
    el.className = 'pin' + (opts.ping ? ' ping' : '');
    el.style.left = (b.x / MAP.width * 100) + '%';
    el.style.top = (b.y / MAP.height * 100) + '%';
    const num = document.createElement('b');
    num.textContent = b.num;
    el.appendChild(num);
    if (opts.label) {
      const name = document.createElement('em');
      name.textContent = b.name;
      el.appendChild(name);
    }
    frame.appendChild(el);
  }
}

function mapImage() {
  const img = document.createElement('img');
  img.src = MAP.image;
  img.alt = '서울과학기술대학교 캠퍼스 지도';
  return img;
}

// 봇 답변 아래에 붙는 지도
function buildMapBox(pins) {
  const box = document.createElement('div');
  box.className = 'mapbox';
  const frame = document.createElement('div');
  frame.className = 'frame';
  frame.appendChild(mapImage());
  renderPins(frame, pins, { label: true, ping: true });
  frame.addEventListener('click', () => openMapDialog(pins));

  const cap = document.createElement('div');
  cap.className = 'cap';
  const who = document.createElement('span');
  who.textContent = pins.map(b => b.num + '번 ' + b.name).join(' · ') + ' (클릭하면 크게)';
  const link = document.createElement('a');
  link.href = MAP.page; link.target = '_blank'; link.rel = 'noopener';
  link.textContent = '층별 안내 보기';
  cap.append(who, link);

  box.append(frame, cap);
  return box;
}

const dlg = document.getElementById('mapDlg');
const dlgFrame = document.getElementById('mapDlgFrame');
function openMapDialog(pins) {
  if (!MAP) return;
  const marked = pins && pins.length;
  dlgFrame.replaceChildren(mapImage());
  renderPins(dlgFrame, marked ? pins : MAP.buildings, { label: !!marked, ping: !!marked });
  dlg.showModal();
}
document.getElementById('mapBtn').addEventListener('click', () => openMapDialog(null));
dlg.querySelector('.close').addEventListener('click', () => dlg.close());
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

// ---- 채팅 ----
function renderMd(text) {
  const html = DOMPurify.sanitize(window.marked.parse(text, { breaks: true }));
  return html.replace(/<a /g, '<a target="_blank" rel="noopener" ');
}

function addMsg(role, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.textContent = text;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  send.disabled = true;

  addMsg('user', text);
  history.push({ role: 'user', content: text });
  const botEl = addMsg('bot', '…');
  let reply = '';

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history }),
    });
    if (!res.ok) throw new Error('서버 오류 ' + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6);
        if (payload === '[DONE]') continue;
        const data = JSON.parse(payload);
        if (data.error) throw new Error(data.error);
        reply += data.text;
        botEl.innerHTML = renderMd(reply);
        chat.scrollTop = chat.scrollHeight;
      }
    }
    if (reply) {
      history.push({ role: 'assistant', content: reply });
      const pins = findBuildings(reply, text);
      if (pins.length) {
        botEl.appendChild(buildMapBox(pins));
        chat.scrollTop = chat.scrollHeight;
      }
    } else {
      botEl.remove();
    }
  } catch (err) {
    botEl.remove();
    history.pop();
    addMsg('error', '⚠ ' + err.message);
  } finally {
    send.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
